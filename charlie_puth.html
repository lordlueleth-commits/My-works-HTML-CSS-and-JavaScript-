    header.appendChild(copyBtn);

    // lyrics box
    const lyricsBox = document.createElement('div');
    lyricsBox.className = 'lyrics-box';
    lyricsBox.textContent = song.lyrics;

    card.appendChild(header);
    card.appendChild(lyricsBox);
    grid.appendChild(card);
  });

  // helper escape
  function escapeHtml(unsafe) {
    return unsafe
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  // copy all lyrics (concatenated with song titles)
  document.getElementById('copyAllBtn').addEventListener('click', async () => {
    let allText = '';
    songsData.forEach((song, i) => {
      allText += `🎵 ${song.title} — ${song.artist}\n\n${song.lyrics}\n\n${i < songsData.length - 1 ? '────────────────────\n\n' : ''}`;
    });
    await copyTextToClipboard(allText);
    showToast('📋 All lyrics copied!');
  });

  // optional: fix any missing newline at end
  console.log('Lyrics library ready —', songsData.length, 'tracks');
</script>
</body>
</html>
