<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>3D House - Three.js</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: sans-serif;
    }
    #info {
      position: absolute;
      top: 10px;
      left: 10px;
      color: #ffffff;
      background: rgba(0, 0, 0, 0.6);
      padding: 8px 12px;
      border-radius: 4px;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="info">Drag to rotate | Scroll to zoom | Right-click to pan</div>

  <!-- Include Three.js and OrbitControls via CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

  <script>
    // 1. Scene Setup
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87ceeb); // Sky blue

    const camera = new THREE.PerspectiveCamera(
      45,
      window.innerWidth / window.innerHeight,
      0.1,
      1000
    );
    camera.position.set(15, 12, 20);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 3, 0);
    controls.update();

    // 2. Lighting
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
    scene.add(ambientLight);

    const sunLight = new THREE.DirectionalLight(0xffffff, 0.8);
    sunLight.position.set(20, 30, 15);
    sunLight.castShadow = true;
    sunLight.shadow.mapSize.width = 2048;
    sunLight.shadow.mapSize.height = 2048;
    sunLight.shadow.camera.near = 0.5;
    sunLight.shadow.camera.far = 60;
    sunLight.shadow.camera.left = -15;
    sunLight.shadow.camera.right = 15;
    sunLight.shadow.camera.top = 15;
    sunLight.shadow.camera.bottom = -15;
    scene.add(sunLight);

    // 3. Materials
    const groundMat = new THREE.MeshStandardMaterial({ color: 0x55aa55 });
    const wallMat = new THREE.MeshStandardMaterial({ color: 0xf5f5dc });   // Beige
    const roofMat = new THREE.MeshStandardMaterial({ color: 0x8b0000 });   // Dark red
    const doorMat = new THREE.MeshStandardMaterial({ color: 0x5c4033 });   // Brown
    const windowMat = new THREE.MeshStandardMaterial({ color: 0xadd8e6, roughness: 0.1 }); // Light blue glass
    const chimneyMat = new THREE.MeshStandardMaterial({ color: 0x708090 });// Slate gray

    // 4. Ground (Lawn)
    const groundGeo = new THREE.PlaneGeometry(50, 50);
    const ground = new THREE.Mesh(groundGeo, groundMat);
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    // 5. House Structure
    const houseGroup = new THREE.Group();

    // Main Walls (Width: 8, Height: 5, Depth: 6)
    const wallsGeo = new THREE.BoxGeometry(8, 5, 6);
    const walls = new THREE.Mesh(wallsGeo, wallMat);
    walls.position.y = 2.5;
    walls.castShadow = true;
    walls.receiveShadow = true;
    houseGroup.add(walls);

    // Roof (Pyramid using ConeGeometry)
    const roofGeo = new THREE.ConeGeometry(6.5, 3, 4);
    const roof = new THREE.Mesh(roofGeo, roofMat);
    roof.position.y = 6.5;
    roof.rotation.y = Math.PI / 4; // Align sides with walls
    roof.castShadow = true;
    houseGroup.add(roof);

    // Door
    const doorGeo = new THREE.BoxGeometry(1.4, 2.8, 0.1);
    const door = new THREE.Mesh(doorGeo, doorMat);
    door.position.set(0, 1.4, 3.01);
    door.castShadow = true;
    houseGroup.add(door);

    // Windows (Front Left & Front Right)
    const windowGeo = new THREE.BoxGeometry(1.5, 1.5, 0.1);
    
    const windowLeft = new THREE.Mesh(windowGeo, windowMat);
    windowLeft.position.set(-2.5, 3, 3.01);
    houseGroup.add(windowLeft);

    const windowRight = new THREE.Mesh(windowGeo, windowMat);
    windowRight.position.set(2.5, 3, 3.01);
    houseGroup.add(windowRight);

    // Chimney
    const chimneyGeo = new THREE.BoxGeometry(0.8, 2.5, 0.8);
    const chimney = new THREE.Mesh(chimneyGeo, chimneyMat);
    chimney.position.set(2.2, 6.5, -1);
    chimney.castShadow = true;
    houseGroup.add(chimney);

    scene.add(houseGroup);

    // 6. Responsive Window Resizing
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // 7. Render Loop
    function animate() {
      requestAnimationFrame(animate);
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
