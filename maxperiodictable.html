<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Periodic Table · Detailed Info Window</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #0b0f1c;
            font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
            padding: 1.5rem 1rem 3rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #eef2ff;
        }

        h1 {
            font-weight: 500;
            font-size: 2rem;
            letter-spacing: 1px;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, #a0c0ff, #d0e0ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            color: #8b9bb4;
            margin-bottom: 2rem;
            font-size: 0.9rem;
            border-bottom: 1px solid #1f2a3a;
            padding-bottom: 0.75rem;
            width: fit-content;
        }

        .table-wrapper {
            max-width: 1280px;
            width: 100%;
            overflow-x: auto;
            border-radius: 20px;
            background: rgba(12, 18, 28, 0.85);
            backdrop-filter: blur(4px);
            padding: 1.5rem 1rem;
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.8), 0 0 0 1px #1f2a3a inset;
        }

        .periodic-grid {
            display: grid;
            grid-template-columns: repeat(18, minmax(68px, 1fr));
            gap: 6px;
            min-width: 1100px;
            margin: 0 auto;
        }

        /* base card style */
        .element {
            background: #111a28;
            border-radius: 12px;
            padding: 8px 4px 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.6), 0 0 0 1px #1e2b3c;
            transition: transform 0.12s ease, box-shadow 0.12s ease;
            cursor: pointer;
            aspect-ratio: 1 / 1;
            text-align: center;
            line-height: 1.2;
            font-weight: 400;
            user-select: none;
        }

        .element:hover {
            transform: scale(1.04);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.8), 0 0 0 1px #3a5a7a;
            z-index: 10;
        }

        .atomic-number {
            font-size: 0.6rem;
            color: #b0c8e0;
            font-weight: 500;
            align-self: flex-start;
            margin-left: 4px;
            margin-top: -2px;
        }

        .symbol {
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: #ffffff;
            text-shadow: 0 0 6px rgba(200, 220, 255, 0.4);
            line-height: 1.1;
            margin: 2px 0 1px;
        }

        .name {
            font-size: 0.55rem;
            font-weight: 500;
            text-transform: uppercase;
            color: #b8cce0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 100%;
            padding: 0 2px;
        }

        .mass {
            font-size: 0.5rem;
            color: #7f95b0;
            font-weight: 400;
            white-space: nowrap;
            margin-top: 2px;
        }

        /* category colors - subtle backgrounds */
        .element[data-category="alkali-metal"] { background: #1f2e3c; border-left: 4px solid #f0b27a; }
        .element[data-category="alkaline-earth"] { background: #1f2e3c; border-left: 4px solid #f7dc6f; }
        .element[data-category="transition-metal"] { background: #1f2e3c; border-left: 4px solid #7fb3d5; }
        .element[data-category="post-transition"] { background: #1f2e3c; border-left: 4px solid #a9cce3; }
        .element[data-category="metalloid"] { background: #1f2e3c; border-left: 4px solid #a3e4d7; }
        .element[data-category="nonmetal"] { background: #1f2e3c; border-left: 4px solid #7dcea0; }
        .element[data-category="halogen"] { background: #1f2e3c; border-left: 4px solid #f5b7b1; }
        .element[data-category="noble-gas"] { background: #1f2e3c; border-left: 4px solid #d7bde2; }
        .element[data-category="lanthanide"] { background: #1f2e3c; border-left: 4px solid #f9e79f; }
        .element[data-category="actinide"] { background: #1f2e3c; border-left: 4px solid #f5cba7; }
        .element[data-category="unknown"] { background: #1f2e3c; border-left: 4px solid #b0b0b0; }

        .lanthanide-actinide-row {
            display: grid;
            grid-template-columns: repeat(18, minmax(68px, 1fr));
            gap: 6px;
            margin-top: 16px;
            min-width: 1100px;
        }

        .legend {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem 1.5rem;
            margin-top: 2rem;
            padding: 1rem 1.5rem;
            background: #0e1622;
            border-radius: 40px;
            border: 1px solid #1f2a3a;
            justify-content: center;
            max-width: 1100px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.75rem;
            color: #b8cce0;
        }

        .legend-color {
            width: 16px;
            height: 16px;
            border-radius: 4px;
        }

        .footer-note {
            margin-top: 1.8rem;
            font-size: 0.75rem;
            color: #5f7390;
            text-align: center;
        }

        /* ---- modal / info window ---- */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(6px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 1rem;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-card {
            background: #101a28;
            border: 1px solid #2a3e55;
            border-radius: 28px;
            width: 100%;
            max-width: 560px;
            padding: 2rem 1.8rem 1.8rem;
            box-shadow: 0 30px 60px -15px black, 0 0 0 1px #1f3042 inset;
            position: relative;
            color: #dae6f5;
            animation: modalIn 0.2s ease-out;
        }

        @keyframes modalIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        .modal-close {
            position: absolute;
            top: 16px; right: 20px;
            background: none;
            border: none;
            font-size: 1.8rem;
            line-height: 1;
            color: #6d8aae;
            cursor: pointer;
            transition: color 0.15s;
            padding: 4px 8px;
            border-radius: 40px;
        }

        .modal-close:hover {
            color: #ffffff;
            background: #1e3145;
        }

        .modal-header {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid #1f3042;
            padding-bottom: 1.2rem;
        }

        .modal-symbol {
            font-size: 3.2rem;
            font-weight: 700;
            line-height: 1;
            color: #ffffff;
            text-shadow: 0 0 12px #3f6faf;
            background: #0b131f;
            width: 80px;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 20px;
            box-shadow: 0 0 0 2px #2a4058;
        }

        .modal-title h2 {
            font-size: 1.8rem;
            font-weight: 500;
            letter-spacing: -0.01em;
            color: #f0f6ff;
            margin-bottom: 4px;
        }

        .modal-title .atomic-number-badge {
            display: inline-block;
            background: #1a2a3c;
            border-radius: 40px;
            padding: 2px 12px;
            font-size: 0.8rem;
            color: #aec6e5;
            letter-spacing: 0.3px;
            border: 1px solid #2c4056;
        }

        .modal-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.8rem 1.5rem;
            margin: 0.5rem 0 0.5rem;
        }

        .modal-item {
            display: flex;
            flex-direction: column;
            gap: 3px;
            background: #0c141f;
            padding: 0.7rem 1rem;
            border-radius: 14px;
            border-left: 4px solid #2d4b6e;
        }

        .modal-item .label {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #7f9bbe;
            font-weight: 500;
        }

        .modal-item .value {
            font-size: 1rem;
            font-weight: 500;
            color: #e2efff;
            word-break: break-word;
        }

        .modal-description {
            background: #0c141f;
            border-radius: 18px;
            padding: 1.2rem 1.2rem;
            margin-top: 0.8rem;
            border: 1px solid #1f3042;
            font-size: 0.9rem;
            line-height: 1.5;
            color: #c6d8f0;
        }

        .modal-description p {
            margin-bottom: 0.5rem;
        }

        .modal-description p:last-child {
            margin-bottom: 0;
        }

        .highlight {
            color: #b3d4ff;
            font-weight: 500;
        }

        .badge-category {
            background: #1d3147;
            border-radius: 20px;
            padding: 2px 12px;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: inline-block;
        }

        @media (max-width: 600px) {
            .modal-card { padding: 1.5rem 1.2rem; }
            .modal-grid { grid-template-columns: 1fr; }
            .modal-symbol { width: 64px; height: 64px; font-size: 2.4rem; }
        }
    </style>
</head>

            // --------------------------------------------------------------
            // Build lookup map
            const elementMap = new Map();
            elements.forEach(el => elementMap.set(el.number, el));

            // containers
            const grid = document.getElementById('periodicGrid');
            const extraContainer = document.getElementById('extraRows');

            // helper: create element card
            function createElementCard(el) {
                const div = document.createElement('div');
                div.className = 'element';
                div.dataset.category = el.category;
                div.dataset.number = el.number;
                div.setAttribute('role', 'button');
                div.setAttribute('tabindex', '0');
                div.setAttribute('aria-label', `${el.name}, atomic number ${el.number}`);

                div.innerHTML = `
                    <div class="atomic-number">${el.number}</div>
                    <div class="symbol">${el.symbol}</div>
                    <div class="name">${el.name}</div>
                    <div class="mass">${el.mass}</div>
                `;

                // click → open modal
                div.addEventListener('click', (e) => {
                    e.stopPropagation();
                    openModal(el);
                });
                // keyboard support
                div.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' || e.key === ' ') {
                        e.preventDefault();
                        openModal(el);
                    }
                });

                return div;
            }

            // --------------------------------------------------------------
            // Fill main grid (periods 1-7, skipping La & Ac series)
            // --------------------------------------------------------------
            for (let period = 1; period <= 7; period++) {
                for (let group = 1; group <= 18; group++) {
                    let el = elements.find(e => e.period === period && e.group === group);
                    if (el && ((el.number >= 57 && el.number <= 71) || (el.number >= 89 && el.number <= 103))) {
                        el = null; // will use placeholder
                    }
                    if (el) {
                        grid.appendChild(createElementCard(el));
                    } else {
                        const placeholder = document.createElement('div');
                        placeholder.className = 'element';
                        placeholder.style.background = 'transparent';
                        placeholder.style.boxShadow = 'none';
                        placeholder.style.border = '1px solid #1a2535';
                        placeholder.style.opacity = '0.25';
                        placeholder.style.pointerEvents = 'none';
                        placeholder.style.aspectRatio = '1 / 1';
                        grid.appendChild(placeholder);
                    }
                }
            }

            // --------------------------------------------------------------
            // Build extra rows for lanthanides and actinides
            // --------------------------------------------------------------
            function buildExtraRow(startNum, endNum) {
                const rowDiv = document.createElement('div');
                rowDiv.style.display = 'grid';
                rowDiv.style.gridTemplateColumns = 'repeat(18, minmax(68px, 1fr))';
                rowDiv.style.gap = '6px';
                rowDiv.style.marginTop = '6px';
                rowDiv.style.minWidth = '1100px';

                for (let group = 1; group <= 18; group++) {
                    const offset = group - 3;
                    const targetNum = startNum + offset;
                    if (group >= 3 && group <= 17 && targetNum <= endNum) {
                        const el = elementMap.get(targetNum);
                        if (el) {
                            rowDiv.appendChild(createElementCard(el));
                        } else {
                            const empty = document.createElement('div');
                            empty.style.aspectRatio = '1 / 1';
                            rowDiv.appendChild(empty);
                        }
                    } else {
                        const empty = document.createElement('div');
                        empty.style.aspectRatio = '1 / 1';
                        if (group === 1) {
                            // label for the row
                            empty.style.display = 'flex';
                            empty.style.alignItems = 'center';
                            empty.style.justifyContent = 'center';
                            empty.style.color = '#90a4c0';
                            empty.style.fontSize = '0.7rem';
                            empty.style.fontWeight = '500';
                            empty.style.transform = 'rotate(-90deg)';
                            empty.style.whiteSpace = 'nowrap';
                            empty.style.letterSpacing = '1px';
                            empty.textContent = startNum === 57 ? 'Lanthanides' : 'Actinides';
                        }
                        rowDiv.appendChild(empty);
                    }
                }
                return rowDiv;
            }

            extraContainer.appendChild(buildExtraRow(57, 71));
            extraContainer.appendChild(buildExtraRow(89, 103));

            const modalCloseBtn = document.getElementById('modalCloseBtn');
            const modalHeader = document.getElementById('modalHeader');
            const modalGrid = document.getElementById('modalGrid');
            const modalDescription = document.getElementById('modalDescription');

            function openModal(el) {
                // header
                modalHeader.innerHTML = `
                    <div class="modal-symbol">${el.symbol}</div>
                    <div class="modal-title">
                        <h2>${el.name}</h2>
                        <span class="atomic-number-badge">Atomic number ${el.number}</span>
                    </div>
                `;

                // grid with extended info
                modalGrid.innerHTML = `
                    <div class="modal-item">
                        <span class="label">Atomic mass</span>
                        <span class="value">${el.mass}</span>
                    </div>
                    <div class="modal-item">
                        <span class="label">Category</span>
                        <span class="value"><span class="badge-category">${el.category.replace(/-/g, ' ')}</span></span>
                    </div>
                    <div class="modal-item">
                        <span class="label">Period</span>
                        <span class="value">${el.period}</span>
                    </div>
                    <div class="modal-item">
                        <span class="label">Group</span>
                        <span class="value">${el.group}</span>
                    </div>
                    <div class="modal-item">
                        <span class="label">Phase (STP)</span>
                        <span class="value">${el.phase}</span>
                    </div>
                    <div class="modal-item">
                        <span class="label">Density</span>
                        <span class="value">${el.density}</span>
                    </div>
                    <div class="modal-item">
                        <span class="label">Melting point</span>
                        <span class="value">${el.melting}</span>
                    </div>
                    <div class="modal-item">
                        <span class="label">Boiling point</span>
                        <span class="value">${el.boiling}</span>
                    </div>
                    <div class="modal-item">
                        <span class="label">Electron config</span>
                        <span class="value">${el.electronConfig}</span>
                    </div>
                    <div class="modal-item">
                        <span class="label">Discovered</span>
                        <span class="value">${el.discovery}</span>
                    </div>
                `;

                // description + uses
                modalDescription.innerHTML = `
                    <p><span class="highlight">Description:</span> ${el.description}</p>
                    <p><span class="highlight">Uses:</span> ${el.uses}</p>
                `;

                modalOverlay.classList.add('active');
                document.body.style.overflow = 'hidden';
            }

            function closeModal() {
                modalOverlay.classList.remove('active');
                document.body.style.overflow = '';
            }

            modalCloseBtn.addEventListener('click', closeModal);
            modalOverlay.addEventListener('click', (e) => {
                if (e.target === modalOverlay) closeModal();
            });
            window.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && modalOverlay.classList.contains('active')) {
                    closeModal();
                }
            });

            // prefill some tooltips? not needed, we use modal.
            // small hover tooltip not used; but we could keep it, but we removed data-tooltip for clarity.
            // The click is now the primary info method.
